<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Devotion Widget</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg-color: #161b22;
            --card-bg: #21262d;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent: #58a6ff;
        }

        body {
            margin: 0;
            padding: 16px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
        }

        .widget-card {
            background-color: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .widget-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background-color: var(--accent);
        }

        .header {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .verse-text {
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .verse-reference {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--accent);
            text-align: right;
            margin-bottom: 16px;
        }

        .prayer-section {
            border-top: 1px solid #30363d;
            padding-top: 12px;
            margin-top: 4px;
        }

        .prayer-text {
            font-size: 0.85rem;
            line-height: 1.4;
            color: var(--text-muted);
            font-style: italic;
            margin-bottom: 6px;
        }

        .prayer-by {
            font-size: 0.75rem;
            color: var(--accent);
            text-align: right;
        }

        .loading, .error {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: center;
            padding: 20px 0;
        }

        .footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            border-top: 1px solid #30363d;
            padding-top: 12px;
        }

        .refresh-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.75rem;
            text-decoration: underline;
            padding: 0;
        }
    </style>
</head>
<body>

    <div class="widget-card">
        <div>
            <div class="header" id="widget-header">Daily Devotion</div>
            <div id="content">
                <div class="loading">Loading today's devotion...</div>
            </div>
        </div>
        <div class="footer-row">
            <button class="refresh-btn" onclick="fetchVerse()">Tap to refresh</button>
            <span id="date-label" style="font-size: 0.75rem; color: var(--text-muted);"></span>
        </div>
    </div>

    <script>
        const JSON_URL = 'daily.json';

        async function fetchVerse() {
            const contentDiv = document.getElementById('content');
            const headerDiv = document.getElementById('widget-header');
            const dateLabelDiv = document.getElementById('date-label');
            
            try {
                const response = await fetch(JSON_URL + '?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                // Automatically generate today's key format: d + MMDD (e.g., October 23 -> d1023)
                const now = new Date();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const todayKey = 'd' + month + day;
                
                // Lookup today's entry, or fallback to the first entry if today isn't found
                let currentItem = data[todayKey];
                if (!currentItem) {
                    const keys = Object.keys(data);
                    currentItem = data[keys[0]]; 
                }

                const verse = currentItem.verse || "No verse found for today.";
                const ref = currentItem.ref || "";
                const prayer = currentItem.prayer || "";
                const prayerBy = currentItem.prayerBy ? `— ${currentItem.prayerBy}` : "";

                headerDiv.innerText = `Daily Devotion • ${now.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}`;
                
                let html = `
                    <div class="verse-text">“${verse}”</div>
                    <div class="verse-reference">${ref}</div>
                `;

                if (prayer) {
                    html += `
                        <div class="prayer-section">
                            <div class="prayer-text">"${prayer}"</div>
                            <div class="prayer-by">${prayerBy}</div>
                        </div>
                    `;
                }

                contentDiv.innerHTML = html;
                dateLabelDiv.innerText = todayKey;

            } catch (error) {
                contentDiv.innerHTML = `<div class="error">Could not load devotion. Check connection.</div>`;
                console.error(error);
            }
        }

        fetchVerse();
    </script>
</body>
</html>
